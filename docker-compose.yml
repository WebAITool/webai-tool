services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      - ../webai-tool/src:/agent_src
    environment:
      - WORKSPACE_BASE_DIR=/workspace
      - CORS_ORIGINS=http://localhost:8082,http://localhost:5173
      - AGENT_SRC_DIR=/agent_src
      - API_KEY=${API_KEY}
      - API_BASE_URL=${API_BASE_URL:-https://api.polza.ai/api/v1}
      - MODEL_NAME=${MODEL_NAME:-z-ai/glm-4.7}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend