[project]
name = "webai-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "langchain-core>=1.2.20",
    "langchain-experimental>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.0.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
